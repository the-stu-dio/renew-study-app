<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RENEW Summary</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=DM+Serif+Display:ital@0;1&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      padding: 20px;
      background: #e9e6f7;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    .topbar {
      max-width: 1060px;
      margin: 0 auto 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .topbar-title {
      color: #3f2f76;
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    .action-group {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .action-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      text-decoration: none;
      border: 1px solid #c8b8f0;
      color: #3f2f76;
      background: #fff;
      border-radius: 10px;
      padding: 8px 12px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
    }

    .action-btn:hover {
      background: #f5f0ff;
    }

    .action-link {
      text-decoration: none;
    }

    @media print {
      * {
        -webkit-print-color-adjust: exact;
        print-color-adjust: exact;
        color-adjust: exact;
        animation: none !important;
      }
      body {
        background: white;
        padding: 0;
        margin: 0;
      }
      .topbar {
        display: none;
      }
    }
  </style>
</head>
<body>
  <div class="topbar">
    <div class="topbar-title">RENEW Summary</div>
    <div class="action-group">
      <a class="action-btn action-link" href="{% url 'hub' %}">Back to Hub</a>
      <button class="action-btn" type="button" onclick="downloadInteractiveHtml()">Download Interactive HTML</button>
    </div>
  </div>

  {% include 'accounts/qualtrics_summary.html' %}

  <script>
    async function downloadSummaryPdf() {
      const summaryElement = document.querySelector('.summary-shell');

      if (!summaryElement) {
        alert('Summary content is not available yet.');
        return;
      }

      if (typeof html2pdf === 'undefined') {
        alert('PDF export is temporarily unavailable. Please try again.');
        return;
      }

      const options = {
        margin: 0.25,
        filename: 'RENEW-Beautiful-Summary.pdf',
        image: { type: 'jpeg', quality: 0.98 },
        html2canvas: { scale: 2, useCORS: true, scrollY: 0 },
        jsPDF: { unit: 'in', format: 'letter', orientation: 'portrait' },
      };

      // disable action buttons while export runs
      const actionButtons = Array.from(document.querySelectorAll('.action-btn'));
      actionButtons.forEach(b => b.disabled = true);

      try {
        await html2pdf().set(options).from(summaryElement).save();
      } catch (err) {
        console.error('PDF export failed', err);
        alert('PDF export failed. Please try again or use the "Download Interactive HTML" option.');
      } finally {
        // allow interaction again and remove any leftover overlays created by the library
        actionButtons.forEach(b => b.disabled = false);
        cleanupPdfOverlay();
      }
    }

    function cleanupPdfOverlay() {
      try {
        // common overlay element/class names used by html2pdf/html2canvas
        const selectors = ['.html2pdf__overlay', '#html2pdf', '.html2canvas-container', '.__html2pdf__overlay'];
        selectors.forEach(sel => {
          document.querySelectorAll(sel).forEach(el => el.remove());
        });

        // also remove any temporary iframes or wrappers
        document.querySelectorAll('iframe[data-html2pdf], div[data-html2pdf-wrapper]').forEach(el => el.remove());

        // reset inline style changes that may dim the page
        document.documentElement.style.removeProperty('opacity');
        document.body.style.removeProperty('opacity');
        document.body.style.removeProperty('pointer-events');
        // reset summary-shell inline styles (html2canvas sometimes applies filters/opacity)
        const summary = document.querySelector('.summary-shell');
        if (summary) {
          summary.style.removeProperty('opacity');
          summary.style.removeProperty('filter');
          summary.style.removeProperty('pointer-events');
        }

        // remove any large absolutely/fixed positioned semi-transparent overlays (deeper scan)
        document.querySelectorAll('*').forEach(el => {
          try {
            const cs = getComputedStyle(el);
            const pos = cs.position;
            const z = parseInt(cs.zIndex) || 0;
            const bg = cs.backgroundColor || '';
            const op = parseFloat(cs.opacity) || 1;
            const rect = el.getBoundingClientRect();
            const coversLarge = rect.width >= (window.innerWidth * 0.45) && rect.height >= (window.innerHeight * 0.18);
            let semiTransparentBg = false;
            if (/rgba\(|hsla\(/.test(bg)) {
              // try to extract alpha
              const m = bg.match(/rgba?\([^\)]+\)/);
              if (m) {
                const parts = m[0].split(',').map(s=>s.trim());
                const alpha = parseFloat(parts[3] || '1');
                semiTransparentBg = alpha > 0 && alpha < 1;
              }
            }
            const hasTransparentFilter = /opacity\(|alpha\(|grayscale\(|blur\(/.test(cs.filter || '');
            if ((pos === 'fixed' || pos === 'absolute' || pos === 'sticky') && (op < 1 || semiTransparentBg || hasTransparentFilter) && coversLarge) {
              // avoid removing our main containers
              if (!el.classList.contains('summary-shell') && !el.classList.contains('hero') && !el.classList.contains('progress-card')) {
                el.remove();
              }
            }
          } catch (e) {
            // ignore
          }
        });
      } catch (e) {
        // don't break UI cleanup if something unexpected happens
        console.warn('cleanupPdfOverlay error', e);
      }
    }

    // Run cleanup on load in case any overlays are present already
    if (document.readyState === 'complete' || document.readyState === 'interactive') {
      setTimeout(cleanupPdfOverlay, 20);
    } else {
      window.addEventListener('DOMContentLoaded', () => setTimeout(cleanupPdfOverlay, 20));
    }

    function hideHubButtonInExportedFile() {
      if (window.location.protocol === 'file:') {
        document.querySelectorAll('.action-link').forEach(el => el.remove());
      }
    }

    if (document.readyState === 'complete' || document.readyState === 'interactive') {
      setTimeout(hideHubButtonInExportedFile, 20);
    } else {
      window.addEventListener('DOMContentLoaded', () => setTimeout(hideHubButtonInExportedFile, 20));
    }

      function downloadInteractiveHtml() {
        const doctype = '<!doctype html>';
        // capture the current full document so expanded/collapsed states persist
        // but remove the hub link from the downloaded copy.
        const parser = new DOMParser();
        const clonedDocument = parser.parseFromString(doctype + document.documentElement.outerHTML, 'text/html');
        clonedDocument.querySelectorAll('.action-link').forEach(el => el.remove());
        let html = doctype + clonedDocument.documentElement.outerHTML;
        html = html.replace(/<a\b[^>]*class="[^"]*action-link[^"]*"[^>]*>Back to Hub<\/a>/i, '');
        const blob = new Blob([html], { type: 'text/html' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'RENEW-Interactive-Summary.html';
        document.body.appendChild(a);
        a.click();
        a.remove();
        URL.revokeObjectURL(url);
      }
  </script>
</body>
</html>
