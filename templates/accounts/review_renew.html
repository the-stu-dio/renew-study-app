{% extends 'base.html' %}
{% load static %}

{% block title %}Review RENEW{% endblock %}

{% block extra_css %}
<style>
    body, html { background: #f4f0fb; }
    .review-container {
        min-height: auto;
        display: flex;
        align-items: flex-start; /* move up */
        justify-content: flex-start; /* shift left */
        padding: 8px 40px; /* reduce top spacing and add left padding */
        box-sizing: border-box;
        width: 100%;
    }
    .boxes-row-wrapper {
        display: flex;
        align-items: center;
        gap: 24px;
        justify-content: flex-start;
    }

    .boxes-row {
        display: flex;
        gap: 18px;
        align-items: center;
        justify-content: flex-start; /* ensure row is left-aligned */
        margin-top: 8px;
        flex-wrap: nowrap;
        overflow-x: auto;
        padding-bottom: 6px;
    }

    .review-link { display: inline-block; text-decoration: none; }
    .review-link:focus { outline: none; }

    .boxes-label {
        font-size: 1.05rem;
        font-weight: 700;
        color: #5a3e8c;
        white-space: nowrap;
    }
    .review-box {
        width: 64px;
        height: 64px;
        border: 3px solid #5a3e8c;
        background: white;
        border-radius: 8px;
        box-shadow: 0 6px 18px rgba(90,62,140,0.08);
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
    }

    .box-img {
        width: 100%;
        height: 100%;
        object-fit: cover; /* fill the entire box */
        display: block;
    }
    .back-button {
        position: fixed;
        left: 18px;
        bottom: 18px;
        background-color: #6c757d;
        color: white;
        border: none;
        padding: 10px 14px;
        border-radius: 10px;
        font-size: 14px;
        font-weight: 500;
        cursor: pointer;
        transition: background-color 0.2s, transform 0.1s;
        text-decoration: none;
        z-index: 1200;
        box-shadow: 0 6px 18px rgba(0,0,0,0.12);
    }
    .back-button:hover { background-color: #5a6268; transform: translateY(-2px); }
    @media (max-width: 480px) {
        .boxes-row { gap: 10px; }
        .review-box { width: 48px; height: 48px; }
        .box-img { object-fit: cover; }
        .back-button { left: 12px; bottom: 12px; padding: 8px 12px; }
    }
</style>
{% endblock %}
